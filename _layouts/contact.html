---
layout: default
bodyClass: "page-contact"
---
{% capture hdr %}{{ content }}{% endcapture %}
{% include page-header.html content=hdr %}
<div class="container">
  <div class="contact-grid">
    <div class="card">
      <h3>WhatsApp</h3>
      <p>{{ site.data.contact.phone }}</p>
      <a class="btn btn-primary" href="https://api.whatsapp.com/send/?phone=5544998348366&text=Ol%C3%A1%20Gostaria%20de%20mais%20informa%C3%A7%C3%B5es%20sobre%20AppSec&type=phone_number&app_absent=0" target="_blank" rel="noopener noreferrer">Chamar no WhatsApp</a>
    </div>
    <div class="card">
      <h3>E-mail</h3>
      <p>{{ site.data.contact.email }}</p>
      <a class="btn btn-outline" href="mailto:{{ site.data.contact.email }}">Enviar e-mail</a>
    </div>
  </div>
</div>
