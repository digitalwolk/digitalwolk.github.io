---
layout: default
bodyClass: "page-team"
---
<section class="page-header">
  <div class="container"><div class="inner">
    {% if page.image %}<img src="{{ page.image | relative_url }}" alt="Foto de {{ page.title }}" width="120" height="120" style="border-radius:var(--r-lg);object-fit:cover">{% endif %}
    <h1>{{ page.title }}</h1>
    <p>{{ page.jobtitle }}</p>
  </div></div>
</section>
<div class="container"><div class="prose">{{ content }}
  {% if page.linkedinurl %}<p><a href="{{ page.linkedinurl }}" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>{% endif %}
</div></div>
